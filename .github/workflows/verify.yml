# The gate, run on every push and pull request. No secrets, no installs, no network:
# verify.sh is bash + python3 -I (standard library), so the runner's defaults suffice.
name: verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: verify.sh
        run: ./verify.sh
